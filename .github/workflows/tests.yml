name: Django tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check --settings=employee_api.test_settings

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run --settings=employee_api.test_settings

      - name: Run tests
        run: python manage.py test --settings=employee_api.test_settings
